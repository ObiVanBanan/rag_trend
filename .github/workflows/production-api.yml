name: production-api

on:
  push:
    branches:
      - prod/rag-tender-api
  pull_request:
    paths:
      - "src/nomenclature_matcher/api.py"
      - "src/nomenclature_matcher/production.py"
      - "tests/test_production_api.py"
      - "Dockerfile"
      - "docker-compose.yml"
      - "pyproject.toml"
      - ".github/workflows/production-api.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install test dependencies
        run: uv sync --extra test

      - name: Run production API contract tests
        run: uv run python -m pytest -q tests/test_production_api.py

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build API image
        run: docker build -t rag-tender-api:test .
