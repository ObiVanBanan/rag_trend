name: Process Santech competitor catalog

on:
  push:
    branches:
      - codex/deepseek-query-interpreter
    paths:
      - santech_products_full.csv
      - scripts/process_santech_competitors.py
      - scripts/build_santech_ld_scope.py
      - .github/workflows/process-santech-competitors.yml
      - .gitattributes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Verify LFS input
        shell: bash
        run: |
          git lfs pull --include="santech_products_full.csv"
          ls -lh santech_products_full.csv
          if head -n 1 santech_products_full.csv | grep -q 'git-lfs.github.com/spec'; then
            echo 'CSV is still an LFS pointer'
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install processor dependency
        run: python -m pip install --disable-pip-version-check 'duckdb>=1.1,<2'

      - name: Process competitor catalog
        run: |
          python scripts/process_santech_competitors.py \
            --input santech_products_full.csv \
            --output-dir data/competitors \
            --threads 4
          python scripts/build_santech_ld_scope.py \
            --input santech_products_full.csv \
            --output-dir data/competitors \
            --threads 4

      - name: Show generated profile
        run: |
          cat data/competitors/README.md
          cat data/competitors/LD_SCOPE.md
          ls -lh data/competitors

      - name: Commit processed artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git lfs track 'data/competitors/*.parquet'
          git add .gitattributes data/competitors
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Process competitor product catalog'
          git fetch origin codex/deepseek-query-interpreter
          git rebase origin/codex/deepseek-query-interpreter
          git push origin HEAD:codex/deepseek-query-interpreter
