name: Test matcher and MCP web search

on:
  push:
    branches:
      - codex/deepseek-query-interpreter
    paths:
      - src/nomenclature_matcher/web_search_mcp.py
      - src/nomenclature_matcher/query_interpreter.py
      - src/nomenclature_matcher/matcher.py
      - src/nomenclature_matcher/settings.py
      - src/nomenclature_matcher/prompts/query_interpreter_system.md
      - scripts/test_mcp_web_search.py
      - tests/test_web_search_mcp.py
      - tests/test_competitor_lookup.py
      - pyproject.toml
      - .github/workflows/test-competitor-lookup.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project and test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[test,review]'

      - name: Run full regression suite
        run: python -m pytest -q
